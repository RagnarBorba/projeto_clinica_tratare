<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Componente - Tratare</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primaria: '#C5A059',
                        escuro: '#121212',
                        platina: '#E5E5E5',
                        bege: '#F5F5F0',
                    },
                    fontFamily: {
                        title: ['Noto Serif', 'serif'],
                        body: ['Manrope', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <style type="text/tailwind">
        /* Estilização do trilho do input */
        .slider-input::-webkit-slider-thumb {
            appearance: none;
            width: 40px;
            height: 1000px;
            background: transparent;
            cursor: col-resize;
        }
        .slider-input::-moz-range-thumb {
            width: 40px;
            height: 1000px;
            background: transparent;
            cursor: col-resize;
            border: none;
        }

    </style>

</head>

<body class="bg-escuro">

    <section class="py-20 flex items-center justify-center min-h-screen">

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

            <div class="text-center mb-16">
                <h2 class="text-primaria uppercase tracking-[0.3em] text-sm font-bold mb-4 italic animate-fade-in">
                    Transformações Reais</h2>
                <h3 class="text-4xl md:text-5xl font-title leading-tight">A arte de recriar <br><span
                        class="text-primaria">sorrisos memoráveis</span></h3>
            </div>

            <div
                class="relative aspect-video overflow-hidden rounded-lg border border-white/10 shadow-2xl bg-[#1a1a1a]">

                <img src="img/Faceta Resina - antes.webp" class="absolute inset-0 w-full h-full object-cover"
                    alt="Antes">

                <div class="absolute inset-0 w-full h-full overflow-hidden after-img pointer-events-none"
                    style="width: 50%;">
                    <img src="img/Faceta Resina - depois.webp" class="absolute inset-0 w-full h-full object-cover"
                        id="image-after-el" alt="Depois">
                </div>

                <div class="absolute inset-y-0 pointer-events-none slider-line"
                    style="left: 50%; transform: translateX(-50%);">
                    <div class="w-[1px] h-full bg-primaria/80 shadow-[0_0_10px_rgba(197,160,89,0.5)]"></div>
                    <div
                        class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-8 h-8 bg-primaria rounded-full flex items-center justify-center text-white shadow-xl border border-white/20">
                        <i data-lucide="chevrons-left-right" class="w-4 h-4"></i>
                    </div>
                </div>

                <input type="range" min="0" max="100" value="50"
                    class="absolute inset-0 w-full h-full appearance-none bg-transparent cursor-col-resize z-20 slider-input"
                    oninput="moveSlider(this)">

            </div>

            <p class="mt-6 text-center text-platina/40 text-[11px] uppercase tracking-widest italic">
                Arraste para comparar o planejamento digital
            </p>

            <div
                class="relative aspect-video overflow-hidden rounded-lg border border-white/10 shadow-2xl bg-[#1a1a1a]">

                <img src="img/Faceta Resina - antes.webp" class="absolute inset-0 w-full h-full object-cover"
                    alt="Antes">

                <div class="absolute inset-0 w-full h-full overflow-hidden after-img pointer-events-none"
                    style="width: 50%;">
                    <img src="img/Faceta Resina - depois.webp" class="absolute inset-0 w-full h-full object-cover"
                        id="image-after-el" alt="Depois">
                </div>

                <div class="absolute inset-y-0 pointer-events-none slider-line"
                    style="left: 50%; transform: translateX(-50%);">
                    <div class="w-[1px] h-full bg-primaria/80 shadow-[0_0_10px_rgba(197,160,89,0.5)]"></div>
                    <div
                        class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-8 h-8 bg-primaria rounded-full flex items-center justify-center text-white shadow-xl border border-white/20">
                        <i data-lucide="chevrons-left-right" class="w-4 h-4"></i>
                    </div>
                </div>

                <input type="range" min="0" max="100" value="50"
                    class="absolute inset-0 w-full h-full appearance-none bg-transparent cursor-col-resize z-20 slider-input"
                    oninput="moveSlider(this)">

            </div>

            <p class="mt-6 text-center text-platina/40 text-[11px] uppercase tracking-widest italic">
                Arraste para comparar o planejamento digital
            </p>


        </div>
    </section>

    <script>
        // Inicializa ícones
        lucide.createIcons();

        function moveSlider(input) {
            const container = input.parentElement;
            const afterImgContainer = container.querySelector('.after-img');
            const afterImage = afterImgContainer.querySelector('img');
            const sliderLine = container.querySelector('.slider-line');

            const value = input.value;

            // Ajusta a largura da máscara
            afterImgContainer.style.width = value + '%';

            // Ajusta a posição da linha
            sliderLine.style.left = value + '%';

            // Mantém a imagem interna no tamanho real do container para não esticar
            afterImage.style.width = container.offsetWidth + 'px';
        }

        // Garante que a imagem carregue com o tamanho correto
        window.addEventListener('resize', () => {
            const input = document.querySelector('.slider-input');
            if (input) moveSlider(input);
        });

        // Executa uma vez no início
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const input = document.querySelector('.slider-input');
                if (input) moveSlider(input);
            }, 100);
        });
    </script>

    <!--bloco - teste carrocel -->
    <section id="galeria" class="py-24 bg-platina overflow-hidden">
        <div class="max-w-7xl mx-auto px-4 mb-12 text-center">
            <h2 class="text-primaria uppercase tracking-[0.3em] text-sm font-bold mb-4 italic">Nossa Clínica</h2>
            <h3 class="text-4xl font-title text-escuro">Ambiente projetado para o seu <span
                    class="text-primaria">conforto</span></h3>
        </div>

        <div class="relative w-full">
            <div id="carousel-track" class="flex transition-transform duration-700 ease-in-out gap-6 px-[10%]">

                <div
                    class="min-w-[300px] md:min-w-[450px] aspect-video rounded-lg overflow-hidden shadow-lg transform transition-transform duration-500 carousel-item">
                    <img src="https://images.unsplash.com/photo-1629909613654-28e377c37b09?auto=format&fit=crop&q=80&w=1000"
                        class="w-full h-full object-cover" alt="Clínica 1">
                </div>

                <div
                    class="min-w-[300px] md:min-w-[450px] aspect-video rounded-lg overflow-hidden shadow-lg transform transition-transform duration-500 carousel-item">
                    <img src="https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?auto=format&fit=crop&q=80&w=1000"
                        class="w-full h-full object-cover" alt="Clínica 2">
                </div>

                <div
                    class="min-w-[300px] md:min-w-[450px] aspect-video rounded-lg overflow-hidden shadow-lg transform transition-transform duration-500 carousel-item">
                    <img src="https://images.unsplash.com/photo-1504813184591-01592fd03cf7?auto=format&fit=crop&q=80&w=1000"
                        class="w-full h-full object-cover" alt="Clínica 3">
                </div>

                <div
                    class="min-w-[300px] md:min-w-[450px] aspect-video rounded-lg overflow-hidden shadow-lg transform transition-transform duration-500 carousel-item">
                    <img src="https://images.unsplash.com/photo-1606811841689-23dfddce3e95?auto=format&fit=crop&q=80&w=1000"
                        class="w-full h-full object-cover" alt="Clínica 4">
                </div>
            </div>

            <div class="flex justify-center gap-4 mt-10">
                <button onclick="prevSlide()"
                    class="p-3 border border-primaria text-primaria rounded-lg hover:bg-primaria hover:text-white transition-all">
                    <i data-lucide="chevron-left"></i>
                </button>
                <button onclick="nextSlide()"
                    class="p-3 border border-primaria text-primaria rounded-lg hover:bg-primaria hover:text-white transition-all">
                    <i data-lucide="chevron-right"></i>
                </button>
            </div>
        </div>
    </section>

</body>

</html>
